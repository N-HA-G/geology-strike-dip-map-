<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>走向・傾斜マップ</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><h1>走向・傾斜マップ</h1><p>地理院タイルを用いた構造地質調査データ表示ツール</p></header>
<main class="app">
<section class="panel">
<h2>測定値を追加</h2>
<p class="guide">地図をクリックすると，その地点の緯度・経度が自動入力されます．</p>
<form id="form">
<label>地点番号<input id="pointId" value="F001"></label>
<div class="two">
<label>緯度<input id="lat" type="number" step="0.000001" value="34.910884" required></label>
<label>経度<input id="lng" type="number" step="0.000001" value="139.824167" required></label>
</div>
<label>走向<input id="strikeText" value="N30E" placeholder="例．N30E" required></label>
<label>傾斜<input id="dipText" value="45SE" placeholder="例．45SE" required></label>
<p class="help">走向はN30E，N30°E，S20W，030などに対応します．傾斜は45SE，45°NWなどに対応します．</p>
<div class="conversion">
<div>変換後の走向．<strong id="outStrike">30.0°</strong></div>
<div>傾斜角．<strong id="outDip">45.0°</strong></div>
<div>傾斜方向．<strong id="outDir">120.0°</strong></div>
</div>
<div id="msg" class="msg"></div>
<div class="actions">
<button class="primary" type="submit">地図に追加</button>
<button type="button" id="clear">全地点を削除</button>
</div>
</form>
<p class="count">表示地点数．<strong id="count">0</strong></p>
</section>
<section class="mapWrap"><div id="map"></div></section>
</main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
